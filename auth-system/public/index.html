<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; }
        h1 { color: #333; }
        .container { background: #f5f5f5; padding: 30px; border-radius: 8px; }
        button, .g_id_signin { margin: 10px 0; }
        .result { margin-top: 20px; padding: 15px; background: white; border-radius: 4px; white-space: pre-wrap; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #4285f4; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #3367d6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Auth System Test</h1>

        <h3>Continue with Google</h3>
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleGoogleLogin"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="outline"
             data-text="continue_with"
             data-size="large"
             data-logo_alignment="left">
        </div>

        <hr>

        <h3>Email / Password Login</h3>
        <div>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="handleEmailLogin()">Login</button>
        </div>

        <hr>

        <h3>Register</h3>
        <div>
            <input type="text" id="registerName" placeholder="Name">
            <input type="email" id="registerEmail" placeholder="Email">
            <input type="password" id="registerPassword" placeholder="Password">
            <select id="registerRole" style="width: 100%; padding: 10px; margin: 5px 0;">
                <option value="client">Client</option>
                <option value="restaurateur">Restaurateur</option>
            </select>
            <button onclick="handleRegister()">Register</button>
        </div>

        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        function showResult(data) {
            const el = document.getElementById('result');
            el.style.display = 'block';
            el.textContent = JSON.stringify(data, null, 2);
        }

        async function handleGoogleLogin(response) {
            try {
                const res = await fetch('/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        credential: response.credential,
                        role: 'client'
                    })
                });
                const data = await res.json();
                showResult(data);
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        async function handleEmailLogin() {
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                showResult(data);
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        async function handleRegister() {
            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('registerName').value,
                        email: document.getElementById('registerEmail').value,
                        password: document.getElementById('registerPassword').value,
                        role: document.getElementById('registerRole').value
                    })
                });
                const data = await res.json();
                showResult(data);
            } catch (error) {
                showResult({ error: error.message });
            }
        }
    </script>
</body>
</html>
